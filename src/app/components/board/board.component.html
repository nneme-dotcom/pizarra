<div class="board" cdkDropListGroup>
  @for (s of statuses; track s.id) {
    <section class="column" [class]="'column ' + s.id" [attr.aria-label]="s.label">
      <header class="col-head">
        <span class="status-dot" [class]="s.id" aria-hidden="true"></span>
        <h2 class="col-title display">{{ s.label }}</h2>
        <span class="col-count num">{{ columns()[s.id].length }}</span>
        @if (store.canEdit()) {
          <button type="button" class="btn btn-ghost btn-sm btn-touch ms-auto" (click)="create.emit(s.id)" [attr.aria-label]="'Nueva tarea en ' + s.label">
            <i class="bi bi-plus-lg" aria-hidden="true"></i>
          </button>
        }
      </header>

      <div
        class="col-list"
        cdkDropList
        [cdkDropListData]="s.id"
        [cdkDropListDisabled]="!store.canEdit()"
        (cdkDropListDropped)="drop($event)"
      >
        @for (t of columns()[s.id]; track t.id) {
          <button
            type="button"
            class="task"
            cdkDrag
            [cdkDragData]="t"
            [cdkDragDisabled]="!store.canEdit()"
            [class.late]="isLate(t)"
            (click)="open.emit(t)"
          >
            <span class="task-title">{{ t.title }}</span>
            <span class="task-meta num">
              <span class="prod-badge" [class.org]="t.product === 'ORG'">{{ products[t.product].short }}</span>
              <span [class.text-danger]="isLate(t)">{{ shortDate(t.due) }}</span>
              <span>{{ t.estimate }} h</span>
              @if (t.milestone) { <span class="diamond" title="Hito" aria-label="Hito" role="img"></span> }
            </span>
          </button>
        } @empty {
          <p class="col-empty">Sin tareas</p>
        }
      </div>
    </section>
  }
</div>
