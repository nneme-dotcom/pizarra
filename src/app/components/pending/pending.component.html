<section aria-labelledby="pending-title">
  <div class="head">
    <h2 id="pending-title" class="section-title">Pendiente</h2>
    <span class="count num">{{ open_().length }} · {{ hours() }} h</span>
  </div>

  @if (open_().length === 0) {
    <p class="text-body-secondary small mb-0">No queda nada pendiente.</p>
  } @else {
    <ol class="list list-unstyled mb-0">
      @for (t of visible(); track t.id) {
        <li>
          <button type="button" class="item" (click)="open.emit(t)">
            <span class="date num" [class.text-danger]="isLate(t)">{{ day(t.due) }} {{ month(t.due) }}</span>
            <span class="status-dot" [class]="t.status" role="img" [attr.aria-label]="statusLabel[t.status]"></span>
            <span class="title">{{ t.title }}</span>
            <span class="prod-badge" [class.org]="t.product === 'ORG'">{{ products[t.product].short }}</span>
            <span class="when" [class.text-danger]="isLate(t)">{{ when(t) }}</span>
          </button>
        </li>
      }
    </ol>
    @if (open_().length > limit) {
      <button type="button" class="more" (click)="expanded.set(!expanded())">
        {{ expanded() ? 'Ver menos' : 'Ver las ' + open_().length }}
      </button>
    }
  }
</section>
